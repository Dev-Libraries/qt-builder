name: Build Qt 6.12.1 Multi-Platform

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Phiên bản Qt cần build'
        required: true
        default: '6.12.1'

permissions:
  contents: write

jobs:
  # GIAI ĐOẠN 1: Build song song từng OS & Architecture
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_dir: Linux
            arch_dir: amd64
          - runner: ubuntu-24.04-arm
            os_dir: Linux
            arch_dir: arm64
          - runner: windows-latest
            os_dir: Windows
            arch_dir: amd64
          - runner: windows-11-arm
            os_dir: Windows
            arch_dir: arm64
          - runner: macos-15-intel
            os_dir: MacOS
            arch_dir: amd64
          - runner: macos-latest
            os_dir: MacOS
            arch_dir: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Cài thư viện hệ thống (Linux)
        if: matrix.os_dir == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xkb-dev

      - name: Cài Ninja (Windows)
        if: matrix.os_dir == 'Windows'
        run: choco install ninja -y

      - name: Thiết lập MSVC (Windows amd64)
        if: matrix.os_dir == 'Windows' && matrix.arch_dir == 'amd64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Thiết lập MSVC (Windows arm64)
        if: matrix.os_dir == 'Windows' && matrix.arch_dir == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Cài Ninja (macOS)
        if: matrix.os_dir == 'MacOS'
        run: brew install ninja

      - name: Tải mã nguồn qtbase ${{ inputs.qt_version }}
        shell: bash
        run: |
          VER="${{ inputs.qt_version }}"
          MINOR="${VER%.*}"
          URL_OFFICIAL="https://download.qt.io/official_releases/qt/${MINOR}/${VER}/submodules/qtbase-everywhere-src-${VER}.tar.xz"
          URL_ARCHIVE="https://download.qt.io/archive/qt/${MINOR}/${VER}/submodules/qtbase-everywhere-src-${VER}.tar.xz"
          curl -fL -o qtbase.tar.xz "$URL_OFFICIAL" || curl -fL -o qtbase.tar.xz "$URL_ARCHIVE"
          tar -xf qtbase.tar.xz
          mv "qtbase-everywhere-src-${VER}" qtbase-src

      - name: Biên dịch và Cài đặt vào cấu trúc thư mục đích
        shell: bash
        run: |
          INSTALL_DIR="$PWD/dist/Qt-${{ inputs.qt_version }}/${{ matrix.os_dir }}/${{ matrix.arch_dir }}"
          cmake -S qtbase-src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Lưu tạm kết quả build của nền tảng này
        uses: actions/upload-artifact@v4
        with:
          name: qt-${{ matrix.os_dir }}-${{ matrix.arch_dir }}
          path: dist/

  # GIAI ĐOẠN 2: Gom tất cả vào 1 file ZIP và đẩy lên Releases
  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Tải và gộp toàn bộ thư mục OS/Arch
        uses: actions/download-artifact@v4
        with:
          path: merged/
          merge-multiple: true

      - name: Nén thành 1 file ZIP duy nhất
        run: |
          cd merged
          zip -r ../Qt-${{ inputs.qt_version }}-AllPlatforms.zip Qt-${{ inputs.qt_version }}

      - name: Đẩy lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.qt_version }}
          name: Qt ${{ inputs.qt_version }} All-in-One Prebuilt
          files: Qt-${{ inputs.qt_version }}-AllPlatforms.zip
