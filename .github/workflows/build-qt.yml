name: Build Qt
run-name: Build Qt ${{ inputs.qt_version }} - ${{ inputs.target_platform }}${{ inputs.variant_tag != '' && format(' ({0})', inputs.variant_tag) || '' }}

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Phiên bản Qt cần build (vd: 6.12.1)'
        required: true
        default: '6.12.1'
      target_platform:
        description: 'Chọn nền tảng (OS - Arch)'
        type: choice
        required: true
        default: 'Win10-amd64'
        options:
          - Win10-amd64
          - Win11-amd64
          - Win11-arm64
          - Ubuntu22.04-amd64
          - Ubuntu22.04-arm64
          - Ubuntu24.04-amd64
          - Ubuntu24.04-arm64
          - MacOS-amd64
          - MacOS-arm64
      variant_tag:
        description: 'Nhãn hậu tố tùy chọn (vd: minimal, full - để trống nếu mặc định)'
        required: false
        default: ''
      custom_cmake_flags:
        description: 'Cờ CMake bổ sung tùy ý (vd: -DQT_FEATURE_sql=OFF)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: >-
      ${{
        inputs.target_platform == 'Win10-amd64'       && 'windows-2022' ||
        inputs.target_platform == 'Win11-amd64'       && 'windows-2025' ||
        inputs.target_platform == 'Win11-arm64'       && 'windows-11-arm' ||
        inputs.target_platform == 'Ubuntu22.04-amd64' && 'ubuntu-22.04' ||
        inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'Ubuntu24.04-amd64' && 'ubuntu-24.04' ||
        inputs.target_platform == 'Ubuntu24.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'MacOS-amd64'       && 'macos-15-intel' ||
        'macos-latest'
      }}
    container: ${{ inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu:22.04' || null }}

    steps:
      - name: 1. Phân tách OS & Arch
        id: platform
        shell: bash
        run: |
          PLATFORM="${{ inputs.target_platform }}"
          OS_DIR="${PLATFORM%-*}"
          ARCH_DIR="${PLATFORM#*-}"
          echo "os_dir=$OS_DIR" >> $GITHUB_OUTPUT
          echo "arch_dir=$ARCH_DIR" >> $GITHUB_OUTPUT

      - name: 2. Cài công cụ & thư viện hệ thống (Ubuntu / Container)
        if: startsWith(steps.platform.outputs.os_dir, 'Ubuntu')
        shell: bash
        run: |
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y build-essential python3-pip curl xz-utils p7zip-full pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev \
            libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev \
            libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libdbus-1-dev libglib2.0-dev
          # Dùng CMake & Ninja bản mới qua pip để tương thích tốt với Qt 6.12+ trên cả Ubuntu 22.04
          pip3 install --upgrade cmake ninja || pip3 install --break-system-packages --upgrade cmake ninja

      - name: 3. Thiết lập MSVC (Windows)
        if: startsWith(steps.platform.outputs.os_dir, 'Win')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ steps.platform.outputs.arch_dir == 'amd64' && 'x64' || 'arm64' }}

      - name: 4. Đảm bảo có Ninja (Windows / macOS)
        shell: bash
        run: |
          if [[ "${{ steps.platform.outputs.os_dir }}" == Win* ]]; then
            command -v ninja >/dev/null 2>&1 || choco install ninja -y
          elif [ "${{ steps.platform.outputs.os_dir }}" = "MacOS" ]; then
            brew install ninja
          fi

      - name: 5. Nhận diện Compiler & chốt tên file Release
        id: meta
        shell: bash
        run: |
          OS_DIR="${{ steps.platform.outputs.os_dir }}"
          ARCH_DIR="${{ steps.platform.outputs.arch_dir }}"
          VER="${{ inputs.qt_version }}"

          if [[ "$OS_DIR" == Win* ]]; then
            CL_VER=$(cl 2>&1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
            CL_MINOR=$(echo "$CL_VER" | cut -d. -f2)
            if [ -n "$CL_MINOR" ] && [ "$CL_MINOR" -ge 50 ]; then
              COMPILER="msvc2026"
            else
              COMPILER="msvc2022"
            fi
          elif [[ "$OS_DIR" == Ubuntu* ]]; then
            GCC_MAJOR=$(g++ -dumpversion | cut -d. -f1)
            COMPILER="gcc${GCC_MAJOR}"
          elif [ "$OS_DIR" = "MacOS" ]; then
            COMPILER="clang"
          else
            COMPILER="unknown"
          fi

          SUFFIX="${OS_DIR}-${ARCH_DIR}-${COMPILER}"
          if [ -n "${{ inputs.variant_tag }}" ]; then
            CLEAN_TAG=$(echo "${{ inputs.variant_tag }}" | tr -cd 'a-zA-Z0-9_-')
            SUFFIX="${SUFFIX}-${CLEAN_TAG}"
          fi

          PKG_NAME="libqt_${VER}"
          ZIP_NAME="${PKG_NAME}-${SUFFIX}.zip"

          echo "Detected: OS=$OS_DIR | ARCH=$ARCH_DIR | COMPILER=$COMPILER"
          echo "Output ZIP: $ZIP_NAME"

          echo "compiler=$COMPILER" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: 6. Tải mã nguồn qtbase ${{ inputs.qt_version }}
        shell: bash
        run: |
          VER="${{ inputs.qt_version }}"
          MINOR="${VER%.*}"
          URL_OFFICIAL="https://download.qt.io/official_releases/qt/${MINOR}/${VER}/submodules/qtbase-everywhere-src-${VER}.tar.xz"
          URL_ARCHIVE="https://download.qt.io/archive/qt/${MINOR}/${VER}/submodules/qtbase-everywhere-src-${VER}.tar.xz"
          curl -fL -o qtbase.tar.xz "$URL_OFFICIAL" || curl -fL -o qtbase.tar.xz "$URL_ARCHIVE"
          tar -xf qtbase.tar.xz
          mv "qtbase-everywhere-src-${VER}" qtbase-src

      - name: 7. Biên dịch và Cài đặt
        shell: bash
        run: |
          PKG_DIR="$PWD/dist/${{ steps.meta.outputs.pkg_name }}"
          INSTALL_DIR="${PKG_DIR}/${{ steps.platform.outputs.os_dir }}/${{ steps.platform.outputs.arch_dir }}/${{ steps.meta.outputs.compiler }}"
          EXTRA_FLAGS="${{ inputs.custom_cmake_flags }}"

          if [ "${{ steps.platform.outputs.os_dir }}" = "MacOS" ]; then
            if [ "${{ steps.platform.outputs.arch_dir }}" = "amd64" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=x86_64"
            else
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=arm64"
            fi
          fi

          cmake -S qtbase-src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF \
            $EXTRA_FLAGS

          cmake --build build --parallel
          cmake --install build

      - name: 8. Tạo file CMakeLists.txt tự nhận diện OS / Arch / Compiler
        shell: bash
        run: |
          PKG_NAME="${{ steps.meta.outputs.pkg_name }}"
          cat << 'EOF' > "dist/${PKG_NAME}/CMakeLists.txt"
          cmake_minimum_required(VERSION 3.21)

          # 1. Nhận diện chi tiết hệ điều hành
          if(WIN32)
              if(CMAKE_SYSTEM_VERSION VERSION_GREATER_EQUAL "10.0.22000")
                  set(_QT_OS "Win11")
              else()
                  set(_QT_OS "Win10")
              endif()
          elseif(APPLE)
              set(_QT_OS "MacOS")
          elseif(UNIX)
              if(EXISTS "/etc/os-release")
                  file(READ "/etc/os-release" _OS_RELEASE)
                  string(REGEX MATCH "VERSION_ID=\"([0-9]+\\.[0-9]+)\"" _MATCH "${_OS_RELEASE}")
                  if(CMAKE_MATCH_1)
                      set(_QT_OS "Ubuntu${CMAKE_MATCH_1}")
                  else()
                      set(_QT_OS "Linux")
                  endif()
              else()
                  set(_QT_OS "Linux")
              endif()
          else()
              message(FATAL_ERROR "[Qt] Hệ điều hành không được hỗ trợ: ${CMAKE_SYSTEM_NAME}")
          endif()

          # 2. Nhận diện kiến trúc CPU
          string(TOLOWER "${CMAKE_SYSTEM_PROCESSOR}" _PROC_LOWER)
          if(_PROC_LOWER MATCHES "aarch64|arm64")
              set(_QT_ARCH "arm64")
          elseif(_PROC_LOWER MATCHES "x86_64|amd64|x64")
              set(_QT_ARCH "amd64")
          else()
              message(FATAL_ERROR "[Qt] Kiến trúc CPU không được hỗ trợ: ${CMAKE_SYSTEM_PROCESSOR}")
          endif()

          # 3. Nhận diện trình biên dịch
          if(MSVC)
              if(MSVC_VERSION GREATER_EQUAL 1950)
                  set(_QT_COMPILER "msvc2026")
              else()
                  set(_QT_COMPILER "msvc2022")
              endif()
          elseif(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
              string(REGEX MATCH "^[0-9]+" _GCC_MAJOR "${CMAKE_CXX_COMPILER_VERSION}")
              set(_QT_COMPILER "gcc${_GCC_MAJOR}")
          elseif(CMAKE_CXX_COMPILER_ID MATCHES "Clang")
              set(_QT_COMPILER "clang")
          else()
              message(FATAL_ERROR "[Qt] Trình biên dịch không được hỗ trợ: ${CMAKE_CXX_COMPILER_ID}")
          endif()

          # 4. Tìm thư mục Qt tương ứng (kèm fallback Win11 -> Win10 nếu cùng MSVC)
          set(_QT_TARGET_DIR "${CMAKE_CURRENT_SOURCE_DIR}/${_QT_OS}/${_QT_ARCH}/${_QT_COMPILER}")
          if(NOT EXISTS "${_QT_TARGET_DIR}" AND _QT_OS STREQUAL "Win11" AND EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/Win10/${_QT_ARCH}/${_QT_COMPILER}")
              set(_QT_OS "Win10")
              set(_QT_TARGET_DIR "${CMAKE_CURRENT_SOURCE_DIR}/Win10/${_QT_ARCH}/${_QT_COMPILER}")
          endif()

          if(NOT EXISTS "${_QT_TARGET_DIR}")
              message(FATAL_ERROR "[Qt] Không tìm thấy bản build Qt cho ${_QT_OS}/${_QT_ARCH}/${_QT_COMPILER} tại: ${_QT_TARGET_DIR}")
          endif()

          message(STATUS "[Qt] Đang sử dụng bản build cho: ${_QT_OS}/${_QT_ARCH}/${_QT_COMPILER}")

          set(_NEW_PREFIX_PATH "${_QT_TARGET_DIR};${CMAKE_PREFIX_PATH}")
          set(CMAKE_PREFIX_PATH "${_NEW_PREFIX_PATH}" PARENT_SCOPE)
          set(LIBQT_DIR "${_QT_TARGET_DIR}" PARENT_SCOPE)
          EOF

      - name: 9. Nén file ZIP và đăng lên GitHub Releases
        shell: bash
        run: |
          cd dist
          7z a -tzip "../${{ steps.meta.outputs.zip_name }}" "${{ steps.meta.outputs.pkg_name }}"

      - name: 10. Đẩy lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.qt_version }}
          name: Qt ${{ inputs.qt_version }}
          files: ${{ steps.meta.outputs.zip_name }}
