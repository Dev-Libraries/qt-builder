name: Build Qt Cross Platform
run-name: Build Qt ${{ inputs.qt_version }} - ${{ inputs.target_platform }}${{ inputs.variant_tag != '' && format(' ({0})', inputs.variant_tag) || '' }}

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build (e.g., 6.12.1)'
        required: true
        default: '6.12.1'
      target_platform:
        description: 'Target platform (OS - Arch)'
        type: choice
        required: true
        default: 'Windows-amd64'
        options:
          - Windows-amd64
          - Windows-arm64
          - Ubuntu22.04-amd64
          - Ubuntu22.04-arm64
          - Ubuntu24.04-amd64
          - Ubuntu24.04-arm64
          - MacOS-amd64
          - MacOS-arm64
      variant_tag:
        description: 'Optional extra suffix tag (leave blank for default)'
        required: false
        default: ''
      custom_cmake_flags:
        description: 'Extra CMake flags (leave blank for default)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: >-
      ${{
        inputs.target_platform == 'Windows-amd64'     && 'windows-2025' ||
        inputs.target_platform == 'Windows-arm64'     && 'windows-11-arm' ||
        inputs.target_platform == 'Ubuntu22.04-amd64' && 'ubuntu-22.04' ||
        inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'Ubuntu24.04-amd64' && 'ubuntu-24.04' ||
        inputs.target_platform == 'Ubuntu24.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'MacOS-amd64'       && 'macos-15-intel' ||
        'macos-latest'
      }}
    container: ${{ inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu:22.04' || null }}

    steps:
      - name: 1. Parse OS, Arch & set Release naming
        id: meta
        shell: bash
        run: |
          PLATFORM="${{ inputs.target_platform }}"
          RAW_OS="${PLATFORM%-*}"
          ARCH_DIR="${PLATFORM#*-}"
          VER="${{ inputs.qt_version }}"

          case "$RAW_OS" in
            Win*)    OS_DIR="Windows" ;;
            Ubuntu*) OS_DIR="Linux" ;;
            MacOS*)  OS_DIR="MacOS" ;;
            *)       OS_DIR="$RAW_OS" ;;
          esac

          SUFFIX="${RAW_OS}-${ARCH_DIR}"
          if [ -n "${{ inputs.variant_tag }}" ]; then
            CLEAN_TAG=$(echo "${{ inputs.variant_tag }}" | tr -cd 'a-zA-Z0-9_-')
            SUFFIX="${SUFFIX}-${CLEAN_TAG}"
          fi

          PKG_NAME="libqt_${VER}"
          ZIP_NAME="${PKG_NAME}-${SUFFIX}.zip"

          echo "Internal Dir: ${PKG_NAME}/${OS_DIR}/${ARCH_DIR}"
          echo "Output ZIP:   $ZIP_NAME"

          echo "os_dir=$OS_DIR" >> $GITHUB_OUTPUT
          echo "arch_dir=$ARCH_DIR" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: 2. Install system build dependencies (Linux / Container)
        if: steps.meta.outputs.os_dir == 'Linux'
        shell: bash
        run: |
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update &&$SUDO apt-get install -y \
            build-essential python3-pip curl xz-utils pkg-config libudev-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev \
            libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev \
            libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libsm-dev libice-dev \
            libdbus-1-dev libglib2.0-dev
          pip3 install --upgrade cmake ninja || pip3 install --break-system-packages --upgrade cmake ninja

      - name: 3. Setup MSVC (Windows)
        if: steps.meta.outputs.os_dir == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ steps.meta.outputs.arch_dir == 'amd64' && 'x64' || 'arm64' }}

      - name: 4. Ensure Ninja is available (Windows / macOS)
        shell: bash
        run: |
          if [ "${{ steps.meta.outputs.os_dir }}" = "Windows" ]; then
            command -v ninja >/dev/null 2>&1 || choco install ninja -y
          elif [ "${{ steps.meta.outputs.os_dir }}" = "MacOS" ]; then
            brew install ninja
          fi

      - name: 5. Download qtbase & qtserialport ${{ inputs.qt_version }} sources
        shell: bash
        run: |
          VER="${{ inputs.qt_version }}"
          MINOR="${VER%.*}"

          download_submodule() {
            local MOD="$1"
            local URL_OFFICIAL="https://download.qt.io/official_releases/qt/${MINOR}/${VER}/submodules/${MOD}-everywhere-src-${VER}.tar.xz"
            local URL_ARCHIVE="https://download.qt.io/archive/qt/${MINOR}/${VER}/submodules/${MOD}-everywhere-src-${VER}.tar.xz"
            curl -fL -o "${MOD}.tar.xz" "$URL_OFFICIAL" || curl -fL -o "${MOD}.tar.xz" "$URL_ARCHIVE"
            tar -xf "${MOD}.tar.xz"
            mv "${MOD}-everywhere-src-${VER}" "${MOD}-src"
          }

          download_submodule "qtbase"
          download_submodule "qtserialport"

      - name: 6. Configure, Build & Install (qtbase + qtserialport)
        shell: bash
        run: |
          PKG_DIR="$PWD/dist/${{ steps.meta.outputs.pkg_name }}"
          INSTALL_DIR="${PKG_DIR}/${{ steps.meta.outputs.os_dir }}/${{ steps.meta.outputs.arch_dir }}"
          EXTRA_FLAGS="${{ inputs.custom_cmake_flags }}"

          if [ "${{ steps.meta.outputs.os_dir }}" = "MacOS" ]; then
            if [ "${{ steps.meta.outputs.arch_dir }}" = "amd64" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=x86_64"
            else
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=arm64"
            fi
          elif [ "${{ steps.meta.outputs.os_dir }}" = "Linux" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_xcb=ON"
          fi

          cmake -S qtbase-src -B build-qtbase -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DBUILD_SHARED_LIBS=ON \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF \
            $EXTRA_FLAGS

          cmake --build build-qtbase --parallel
          cmake --install build-qtbase

          if [ "${{ steps.meta.outputs.os_dir }}" = "Linux" ] && [ ! -f "$INSTALL_DIR/plugins/platforms/libqxcb.so" ]; then
            echo "::error::libqxcb.so was not built! Check XCB dependencies."
            exit 1
          fi

          if [ "${{ steps.meta.outputs.os_dir }}" = "Windows" ]; then
            QT_CMAKE="$INSTALL_DIR/bin/qt-cmake.bat"
          else
            QT_CMAKE="$INSTALL_DIR/bin/qt-cmake"
          fi

          "$QT_CMAKE" -S qtserialport-src -B build-qtserialport -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF

          cmake --build build-qtserialport --parallel
          cmake --install build-qtserialport

      - name: 7. Export runtime dependencies & root install_deps.sh (Linux)
        if: steps.meta.outputs.os_dir == 'Linux'
        shell: bash
        run: |
          PKG_DIR="$PWD/dist/${{ steps.meta.outputs.pkg_name }}"
          INSTALL_DIR="${PKG_DIR}/${{ steps.meta.outputs.os_dir }}/${{ steps.meta.outputs.arch_dir }}"

          python3 - "$PKG_DIR" "$INSTALL_DIR" << 'PYEOF'
          import os, subprocess, sys, textwrap
          from pathlib import Path

          pkg_dir = Path(sys.argv[1])
          install_dir = Path(sys.argv[2])

          libs = set()
          for path in install_dir.rglob("*"):
              if not path.is_file() or path.is_symlink():
                  continue
              if ".so" in path.name or os.access(path, os.X_OK):
                  res = subprocess.run(["ldd", str(path)], capture_output=True, text=True)
                  for line in res.stdout.splitlines():
                      if "=>" in line:
                          target = line.split("=>", 1)[1].strip().split()[0]
                          if target.startswith("/"):
                              libs.add(target)

          pkgs = set()
          ignore_pkgs = {"libc6", "libgcc-s1", "libstdc++6"}
          for lib in sorted(libs):
              candidates = {lib, os.path.realpath(lib)}
              for c in list(candidates):
                  if c.startswith("/usr/"):
                      candidates.add(c[4:])
                  elif c.startswith("/lib/"):
                      candidates.add("/usr" + c)
              for c in candidates:
                  res = subprocess.run(["dpkg", "-S", c], capture_output=True, text=True)
                  if res.returncode == 0:
                      for line in res.stdout.splitlines():
                          pkg = line.split(":", 1)[0].strip()
                          if pkg and pkg not in ignore_pkgs:
                              pkgs.add(pkg)
                      break

          deps_file = install_dir / "apt-runtime-deps.txt"
          deps_file.write_text("\n".join(sorted(pkgs)) + ("\n" if pkgs else ""), encoding="utf-8")
          print(f"Exported {len(pkgs)} runtime packages to {deps_file}:")
          print(" ".join(sorted(pkgs)))

          install_sh = pkg_dir / "install_deps.sh"
          install_sh.write_text(textwrap.dedent("""\
              #!/usr/bin/env bash
              set -e

              SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
              OS_DIR="Linux"

              UNAME_ARCH="$(uname -m)"
              case "$UNAME_ARCH" in
                  x86_64|amd64)  ARCH_DIR="amd64" ;;
                  aarch64|arm64) ARCH_DIR="arm64" ;;
                  *)
                      echo "[Error] Unsupported architecture: $UNAME_ARCH"
                      exit 1
                      ;;
              esac

              DEPS_FILE="$SCRIPT_DIR/$OS_DIR/$ARCH_DIR/apt-runtime-deps.txt"
              if [ ! -f "$DEPS_FILE" ]; then
                  echo "[Error] No runtime dependency list found for $OS_DIR/$ARCH_DIR at:$DEPS_FILE"
                  exit 1
              fi

              PKGS=$(tr '\\n' ' ' < "$DEPS_FILE" | xargs)
              if [ -z "$PKGS" ]; then
                  echo "[Info] No extra runtime packages required."
                  exit 0
              fi

              echo "[Info] Installing runtime system packages from: $DEPS_FILE"
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends $PKGS
              echo "[Info] Runtime dependencies installed successfully."
          """), encoding="utf-8")
          install_sh.chmod(0o755)
          PYEOF

      - name: 8. Generate root CMakeLists.txt & README.md
        shell: bash
        run: |
          PKG_NAME="${{ steps.meta.outputs.pkg_name }}"
          VER="${{ inputs.qt_version }}"

          python3 - "$PKG_NAME" "$VER" << 'PYEOF'
          import sys, textwrap
          from pathlib import Path

          pkg_name = sys.argv[1]
          ver = sys.argv[2]
          pkg_dir = Path("dist") / pkg_name

          (pkg_dir / "CMakeLists.txt").write_text(textwrap.dedent("""\
              cmake_minimum_required(VERSION 3.21)

              if(WIN32)
                  set(_QT_OS "Windows")
              elseif(APPLE)
                  set(_QT_OS "MacOS")
              elseif(UNIX)
                  set(_QT_OS "Linux")
              else()
                  message(FATAL_ERROR "[Qt] Unsupported OS: ${CMAKE_SYSTEM_NAME}")
              endif()

              string(TOLOWER "${CMAKE_SYSTEM_PROCESSOR}" _PROC_LOWER)
              if(_PROC_LOWER MATCHES "aarch64|arm64")
                  set(_QT_ARCH "arm64")
              elseif(_PROC_LOWER MATCHES "x86_64|amd64|x64")
                  set(_QT_ARCH "amd64")
              else()
                  message(FATAL_ERROR "[Qt] Unsupported CPU architecture: ${CMAKE_SYSTEM_PROCESSOR}")
              endif()

              set(_QT_TARGET_DIR "${CMAKE_CURRENT_SOURCE_DIR}/${_QT_OS}/${_QT_ARCH}")
              if(NOT EXISTS "${_QT_TARGET_DIR}")
                  message(FATAL_ERROR "[Qt] Prebuilt Qt not found for ${_QT_OS}/${_QT_ARCH} at:${_QT_TARGET_DIR}")
              endif()

              message(STATUS "[Qt] Using prebuilt package for: ${_QT_OS}/${_QT_ARCH}")

              set(_NEW_PREFIX_PATH "${_QT_TARGET_DIR};${CMAKE_PREFIX_PATH}")
              set(CMAKE_PREFIX_PATH "${_NEW_PREFIX_PATH}" PARENT_SCOPE)
              set(LIBQT_DIR "${_QT_TARGET_DIR}" PARENT_SCOPE)
          """), encoding="utf-8")

          (pkg_dir / "README.md").write_text(textwrap.dedent(f"""\
              # Prebuilt Qt {ver} (`{pkg_name}`)

              Prebuilt Qt ({ver} with `qtserialport` & `xcb`) binaries structured for cross-platform CMake projects.

              ## Directory Structure

              ```text
              {pkg_name}/
              ├── CMakeLists.txt       # Auto-detects OS (Windows/Linux/MacOS) and architecture
              ├── README.md            # Integration and setup guide
              ├── install_deps.sh      # Runtime dependency installer (Linux builds only)
              └── <Windows|Linux|MacOS>/<Arch>/
                  ├── bin/
                  ├── include/
                  ├── lib/
                  └── plugins/
              ```

              Multiple platform archives (e.g., `Windows-amd64`, `Ubuntu22.04-arm64`) can be extracted into the same `{pkg_name}/` root directory side by side under `Windows/`, `Linux/`, and `MacOS/`.

              ## CMake Integration

              1. Extract this archive into your project's third-party directory (e.g., `ThirdParty/{pkg_name}`).
              2. Add the subdirectory before calling `find_package(Qt6 ...)` in your root `CMakeLists.txt`:

              ```cmake
              add_subdirectory(ThirdParty/{pkg_name})
              find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets SerialPort)
              ```

              The included `CMakeLists.txt` automatically resolves the matching `<Windows|Linux|MacOS>/<Arch>` path, appends it to `CMAKE_PREFIX_PATH`, and exposes `LIBQT_DIR`.

              ## Linux Target Setup (Including NVIDIA Jetson)

              On clean Ubuntu or Jetson environments, required X11/XCB/OpenGL/udev runtime libraries may not be pre-installed. Run the bundled helper script from the package root before launching your application:

              ```bash
              chmod +x install_deps.sh
              ./install_deps.sh
              ```

              This script detects the current architecture, reads `Linux/<Arch>/apt-runtime-deps.txt`, and installs only the required runtime packages via `apt-get`.
          """), encoding="utf-8")
          PYEOF

      - name: 9. Package ZIP archive
        shell: bash
        run: |
          cd dist
          cmake -E tar "cfv" "../${{ steps.meta.outputs.zip_name }}" --format=zip "${{ steps.meta.outputs.pkg_name }}"

      - name: 10. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.qt_version }}
          name: Qt ${{ inputs.qt_version }}
          draft: false
          files: ${{ steps.meta.outputs.zip_name }}
