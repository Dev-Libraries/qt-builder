name: Build Qt Cross Platform
run-name: Build Qt ${{ inputs.qt_version }} - ${{ inputs.target_platform }}${{ inputs.variant_tag != '' && format(' ({0})', inputs.variant_tag) || '' }}

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build (e.g., 6.12.1)'
        required: true
        default: '6.12.1'
      target_platform:
        description: 'Target platform (OS - Arch)'
        type: choice
        required: true
        default: 'Win11-amd64'
        options:
          - Win11-amd64
          - Win11-arm64
          - Ubuntu22.04-amd64
          - Ubuntu22.04-arm64
          - Ubuntu24.04-amd64
          - Ubuntu24.04-arm64
          - MacOS-amd64
          - MacOS-arm64
      variant_tag:
        description: 'Optional suffix tag (e.g., minimal, full - leave blank for default)'
        required: false
        default: ''
      custom_cmake_flags:
        description: 'Extra CMake flags (e.g., -DQT_FEATURE_sql=OFF)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: >-
      ${{
        inputs.target_platform == 'Win11-amd64'       && 'windows-2025' ||
        inputs.target_platform == 'Win11-arm64'       && 'windows-11-arm' ||
        inputs.target_platform == 'Ubuntu22.04-amd64' && 'ubuntu-22.04' ||
        inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'Ubuntu24.04-amd64' && 'ubuntu-24.04' ||
        inputs.target_platform == 'Ubuntu24.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'MacOS-amd64'       && 'macos-15-intel' ||
        'macos-latest'
      }}
    container: ${{ inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu:22.04' || null }}

    steps:
      - name: 1. Parse OS & Arch
        id: platform
        shell: bash
        run: |
          PLATFORM="${{ inputs.target_platform }}"
          OS_DIR="${PLATFORM%-*}"
          ARCH_DIR="${PLATFORM#*-}"
          echo "os_dir=$OS_DIR" >> $GITHUB_OUTPUT
          echo "arch_dir=$ARCH_DIR" >> $GITHUB_OUTPUT

      - name: 2. Install system build dependencies (Ubuntu / Container)
        if: startsWith(steps.platform.outputs.os_dir, 'Ubuntu')
        shell: bash
        run: |
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update$SUDO apt-get install -y build-essential python3-pip curl xz-utils pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev \
            libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev \
            libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libdbus-1-dev libglib2.0-dev
          pip3 install --upgrade cmake ninja || pip3 install --break-system-packages --upgrade cmake ninja

      - name: 3. Setup MSVC (Windows)
        if: startsWith(steps.platform.outputs.os_dir, 'Win')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ steps.platform.outputs.arch_dir == 'amd64' && 'x64' || 'arm64' }}

      - name: 4. Ensure Ninja is available (Windows / macOS)
        shell: bash
        run: |
          if [[ "${{ steps.platform.outputs.os_dir }}" == Win* ]];
