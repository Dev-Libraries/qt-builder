name: Build Qt Cross Platform
run-name: Build Qt ${{ inputs.qt_version }}

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build (e.g., 6.12.1)'
        required: true
        default: '6.12.1'

      # ==================== Target Platforms ====================
      plat_win11_amd64:
        description: 'Win11-amd64'
        type: boolean
        default: true
      plat_win11_arm64:
        description: 'Win11-arm64'
        type: boolean
        default: false
      plat_ubuntu2204_amd64:
        description: 'Ubuntu22.04-amd64'
        type: boolean
        default: false
      plat_ubuntu2204_arm64:
        description: 'Ubuntu22.04-arm64 (Jetson AGX)'
        type: boolean
        default: false
      plat_ubuntu2404_amd64:
        description: 'Ubuntu24.04-amd64'
        type: boolean
        default: false
      plat_ubuntu2404_arm64:
        description: 'Ubuntu24.04-arm64'
        type: boolean
        default: false
      plat_macos_amd64:
        description: 'MacOS-amd64'
        type: boolean
        default: false
      plat_macos_arm64:
        description: 'MacOS-arm64'
        type: boolean
        default: false

      # ==================== Qt Build Options ====================
      opt_gui:
        description: 'Qt Gui module (uncheck for headless/CLI)'
        type: boolean
        default: true
      opt_widgets:
        description: 'Qt Widgets module'
        type: boolean
        default: true
      opt_network:
        description: 'Qt Network module'
        type: boolean
        default: true
      opt_sql:
        description: 'Qt SQL module'
        type: boolean
        default: true
      opt_opengl:
        description: 'OpenGL support'
        type: boolean
        default: true
      opt_svg:
        description: 'Include qtsvg submodule'
        type: boolean
        default: false
      opt_serialport:
        description: 'Include qtserialport submodule'
        type: boolean
        default: false
      opt_static:
        description: 'Static libraries (unchecked = Shared DLL/SO)'
        type: boolean
        default: false

      # ==================== Advanced / Custom ====================
      variant_tag:
        description: 'Optional extra suffix tag (leave blank for default)'
        required: false
        default: ''
      custom_cmake_flags:
        description: 'Extra CMake flags (e.g., -DQT_FEATURE_dbus=OFF)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.collect.outputs.platforms }}
    steps:
      - name: Collect selected platforms
        id: collect
        shell: bash
        run: |
          PLATFORMS=$(python3 - << 'PYEOF'
          import json

          checks = [
              ("${{ inputs.plat_win11_amd64 }}",      "Win11-amd64"),
              ("${{ inputs.plat_win11_arm64 }}",      "Win11-arm64"),
              ("${{ inputs.plat_ubuntu2204_amd64 }}", "Ubuntu22.04-amd64"),
              ("${{ inputs.plat_ubuntu2204_arm64 }}", "Ubuntu22.04-arm64"),
              ("${{ inputs.plat_ubuntu2404_amd64 }}", "Ubuntu24.04-amd64"),
              ("${{ inputs.plat_ubuntu2404_arm64 }}", "Ubuntu24.04-arm64"),
              ("${{ inputs.plat_macos_amd64 }}",      "MacOS-amd64"),
              ("${{ inputs.plat_macos_arm64 }}",      "MacOS-arm64"),
          ]
          selected = [name for val, name in checks if val == "true"]
          print(json.dumps(selected))
          PYEOF
          )
          echo "Selected platforms: $PLATFORMS"
          if [ "$PLATFORMS" = "[]" ]; then
            echo "::error::Please select at least one target platform checkbox."
            exit 1
          fi
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT

      - name: Ensure GitHub Release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.qt_version }}
          name: Qt ${{ inputs.qt_version }}
          draft: false

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target_platform: ${{ fromJson(needs.prepare.outputs.platforms) }}
    runs-on: >-
      ${{
        matrix.target_platform == 'Win11-amd64'       && 'windows-2025' ||
        matrix.target_platform == 'Win11-arm64'       && 'windows-11-arm' ||
        matrix.target_platform == 'Ubuntu22.04-amd64' && 'ubuntu-22.04' ||
        matrix.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu-24.04-arm' ||
        matrix.target_platform == 'Ubuntu24.04-amd64' && 'ubuntu-24.04' ||
        matrix.target_platform == 'Ubuntu24.04-arm64' && 'ubuntu-24.04-arm' ||
        matrix.target_platform == 'MacOS-amd64'       && 'macos-15-intel' ||
        'macos-latest'
      }}
    container: ${{ matrix.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu:22.04' || null }}

    steps:
      - name: 1. Parse OS & Arch
        id: platform
        shell: bash
        run: |
          PLATFORM="${{ matrix.target_platform }}"
          OS_DIR="${PLATFORM%-*}"
          ARCH_DIR="${PLATFORM#*-}"
          echo "os_dir=$OS_DIR" >> $GITHUB_OUTPUT
          echo "arch_dir=$ARCH_DIR" >> $GITHUB_OUTPUT

      - name: 2. Install system build dependencies (Ubuntu / Container)
        if: startsWith(steps.platform.outputs.os_dir, 'Ubuntu')
        shell: bash
        run: |
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update$SUDO apt-get install -y build-essential python3-pip curl xz-utils pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev \
            libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev \
            libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libdbus-1-dev libglib2.0-dev
          pip3 install --upgrade cmake ninja || pip3 install --break-system-packages --upgrade cmake ninja

      - name: 3. Setup MSVC (Windows)
        if: startsWith(steps.platform.outputs.os_dir, 'Win')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ steps.platform.outputs.arch_dir == 'amd64' && 'x64' || 'arm64' }}

      - name: 4. Ensure Ninja is available (Windows / macOS)
        shell: bash
        run: |
          if [[ "${{ steps.platform.outputs.os_dir }}" == Win* ]]; then
            command -v ninja >/dev/null 2>&1 || choco install ninja -y
          elif [ "${{ steps.platform.outputs.os_dir }}" = "MacOS" ]; then
            brew install ninja
          fi

      - name: 5. Detect Compiler & set Release naming
        id: meta
        shell: bash
        run: |
          OS_DIR="${{ steps.platform.outputs.os_dir }}"
          ARCH_DIR="${{ steps.platform.outputs.arch_dir }}"
          VER="${{ inputs.qt_version }}"

          if [[ "$OS_DIR" == Win* ]]; then
            CL_VER=$(cl 2>&1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
            CL_MINOR=$(echo "$CL_VER" | cut -d. -f2)
            if [ -n "$CL_MINOR" ] && [ "$CL_MINOR" -ge 50 ]; then
              COMPILER="msvc2026"
            else
              COMPILER="msvc2022"
            fi
          elif [[ "$OS_DIR" == Ubuntu* ]]; then
            GCC_MAJOR=$(g++ -dumpversion | cut -d. -f1)
            COMPILER="gcc${GCC_MAJOR}"
          elif [ "$OS_DIR" = "MacOS" ]; then
            COMPILER="clang"
          else
            COMPILER="unknown"
          fi

          SUFFIX="${OS_DIR}-${ARCH_DIR}-${COMPILER}"

          [ "${{ inputs.opt_static }}" = "true" ]     && SUFFIX="${SUFFIX}-static"
          [ "${{ inputs.opt_gui }}" = "false" ]       && SUFFIX="${SUFFIX}-nogui"
          [ "${{ inputs.opt_widgets }}" = "false" ]   && SUFFIX="${SUFFIX}-nowidgets"
          [ "${{ inputs.opt_network }}" = "false" ]   && SUFFIX="${SUFFIX}-nonetwork"
          [ "${{ inputs.opt_sql }}" = "false" ]       && SUFFIX="${SUFFIX}-nosql"
          [ "${{ inputs.opt_opengl }}" = "false" ]    && SUFFIX="${SUFFIX}-noopengl"
          [ "${{ inputs.opt_svg }}" = "true" ]        && SUFFIX="${SUFFIX}-svg"
          [ "${{ inputs.opt_serialport }}" = "true" ] && SUFFIX="${SUFFIX}-serialport"

          if [ -n "${{ inputs.variant_tag }}" ]; then
            CLEAN_TAG=$(echo "${{ inputs.variant_tag }}" | tr -cd 'a-zA-Z0-9_-')
            SUFFIX="${SUFFIX}-${CLEAN_TAG}"
          fi

          PKG_NAME="libqt_${VER}"
          ZIP_NAME="${PKG_NAME}-${SUFFIX}.zip"

          echo "Detected: OS=$OS_DIR | ARCH=$ARCH_DIR \vert{} COMPILER=$COMPILER"
          echo "Output ZIP: $ZIP_NAME"

          echo "compiler=$COMPILER" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: 6. Download Qt ${{ inputs.qt_version }} sources
        shell: bash
        run: |
          VER="${{ inputs.qt_version }}"
          MINOR="${VER%.*}"

          download_submodule() {
            local MOD="$1"
            local URL_OFFICIAL="https://download.qt.io/official_releases/qt/${MINOR}/${VER}/submodules/${MOD}-everywhere-src-${VER}.tar.xz"
            local URL_ARCHIVE="https://download.qt.io/archive/qt/${MINOR}/${VER}/submodules/${MOD}-everywhere-src-${VER}.tar.xz"
            curl -fL -o "${MOD}.tar.xz" "$URL_OFFICIAL" || curl -fL -o "${MOD}.tar.xz" "$URL_ARCHIVE"
            tar -xf "${MOD}.tar.xz"
            mv "${MOD}-everywhere-src-${VER}" "${MOD}-src"
          }

          download_submodule "qtbase"
          [ "${{ inputs.opt_svg }}" = "true" ]        && download_submodule "qtsvg"
          [ "${{ inputs.opt_serialport }}" = "true" ] && download_submodule "qtserialport"

      - name: 7. Configure, Build & Install
        shell: bash
        run: |
          PKG_DIR="$PWD/dist/${{ steps.meta.outputs.pkg_name }}"
          INSTALL_DIR="${PKG_DIR}/${{ steps.platform.outputs.os_dir }}/${{ steps.platform.outputs.arch_dir }}/${{ steps.meta.outputs.compiler }}"
          EXTRA_FLAGS="${{ inputs.custom_cmake_flags }}"

          if [ "${{ steps.platform.outputs.os_dir }}" = "MacOS" ]; then
            if [ "${{ steps.platform.outputs.arch_dir }}" = "amd64" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=x86_64"
            else
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=arm64"
            fi
          fi

          [ "${{ inputs.opt_static }}" = "true" ]  && EXTRA_FLAGS="$EXTRA_FLAGS -DBUILD_SHARED_LIBS=OFF" \vert{}\vert{} EXTRA_FLAGS="$EXTRA_FLAGS -DBUILD_SHARED_LIBS=ON"
          [ "${{ inputs.opt_gui }}" = "true" ]     && EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_gui=ON"     \vert{}\vert{} EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_gui=OFF"
          [ "${{ inputs.opt_widgets }}" = "true" ] && EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_widgets=ON" \vert{}\vert{} EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_widgets=OFF"
          [ "${{ inputs.opt_network }}" = "true" ] && EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_network=ON" \vert{}\vert{} EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_network=OFF"
          [ "${{ inputs.opt_sql }}" = "true" ]     && EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_sql=ON"     \vert{}\vert{} EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_sql=OFF"
          [ "${{ inputs.opt_opengl }}" = "true" ]  && EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_opengl=ON"  \vert{}\vert{} EXTRA_FLAGS="$EXTRA_FLAGS -DQT_FEATURE_opengl=OFF"

          cmake -S qtbase-src -B build-qtbase -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF \
            $EXTRA_FLAGS

          cmake --build build-qtbase --parallel
          cmake --install build-qtbase

          if [[ "${{ steps.platform.outputs.os_dir }}" == Win* ]]; then
            QT_CMAKE="$INSTALL_DIR/bin/qt-cmake.bat"
          else
            QT_CMAKE="$INSTALL_DIR/bin/qt-cmake"
          fi

          build_submodule() {
            local MOD="$1"
            "$QT_CMAKE" -S "${MOD}-src" -B "build-${MOD}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DQT_BUILD_TESTS=OFF \
              -DQT_BUILD_EXAMPLES=OFF
            cmake --build "build-${MOD}" --parallel
            cmake --install "build-${MOD}"
          }

          [ "${{ inputs.opt_svg }}" = "true" ]        && build_submodule "qtsvg"
          [ "${{ inputs.opt_serialport }}" = "true" ] && build_submodule "qtserialport"

      - name: 8. Export runtime dependencies & root install_deps.sh (Ubuntu)
        if: startsWith(steps.platform.outputs.os_dir, 'Ubuntu')
        shell: bash
        run: |
          PKG_DIR="$PWD/dist/${{ steps.meta.outputs.pkg_name }}"
          INSTALL_DIR="${PKG_DIR}/${{ steps.platform.outputs.os_dir }}/${{ steps.platform.outputs.arch_dir }}/${{ steps.meta.outputs.compiler }}"

          python3 - "$PKG_DIR" "$INSTALL_DIR" << 'PYEOF'
          import os, subprocess, sys, textwrap
          from pathlib import Path

          pkg_dir = Path(sys.argv[1])
          install_dir = Path(sys.argv[2])

          libs = set()
          for path in install_dir.rglob("*"):
              if not path.is_file() or path.is_symlink():
                  continue
              if ".so" in path.name or os.access(path, os.X_OK):
                  res = subprocess.run(["ldd", str(path)], capture_output=True, text=True)
                  for line in res.stdout.splitlines():
                      if "=>" in line:
                          target = line.split("=>", 1)[1].strip().split()[0]
                          if target.startswith("/"):
                              libs.add(target)

          pkgs = set()
          ignore_pkgs = {"libc6", "libgcc-s1", "libstdc++6"}
          for lib in sorted(libs):
              candidates = {lib, os.path.realpath(lib)}
              for c in list(candidates):
                  if c.startswith("/usr/"):
                      candidates.add(c[4:])
                  elif c.startswith("/lib/"):
                      candidates.add("/usr" + c)
              for c in candidates:
                  res = subprocess.run(["dpkg", "-S", c], capture_output=True, text=True)
                  if res.returncode == 0:
                      for line in res.stdout.splitlines():
                          pkg = line.split(":", 1)[0].strip()
                          if pkg and pkg not in ignore_pkgs:
                              pkgs.add(pkg)
                      break

          deps_file = install_dir / "apt-runtime-deps.txt"
          deps_file.write_text("\n".join(sorted(pkgs)) + ("\n" if pkgs else ""), encoding="utf-8")
          print(f"Exported {len(pkgs)} runtime packages to {deps_file}:")
          print(" ".join(sorted(pkgs)))

          install_sh = pkg_dir / "install_deps.sh"
          install_sh.write_text(textwrap.dedent("""\
              #!/usr/bin/env bash
              set -e

              SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

              if [ -f /etc/os-release ]; then
                  . /etc/os-release
                  OS_DIR="Ubuntu${VERSION_ID}"
              else
                  echo "[Error] Cannot detect Ubuntu version (/etc/os-release not found)."
                  exit 1
              fi

              UNAME_ARCH="$(uname -m)"
              case "$UNAME_ARCH" in
                  x86_64|amd64)  ARCH_DIR="amd64" ;;
                  aarch64|arm64) ARCH_DIR="arm64" ;;
                  *)
                      echo "[Error] Unsupported architecture: $UNAME_ARCH"
                      exit 1
                      ;;
              esac

              DEPS_FILE=""
              if command -v g++ >/dev/null 2>&1; then
                  GCC_MAJOR="$(g++ -dumpversion | cut -d. -f1)"
                  CANDIDATE="$SCRIPT_DIR/$OS_DIR/$ARCH_DIR/gcc${GCC_MAJOR}/apt-runtime-deps.txt"
                  [ -f "$CANDIDATE" ] && DEPS_FILE="$CANDIDATE"
              fi

              if [ -z "$DEPS_FILE" ]; then
                  DEPS_FILE="$(find "$SCRIPT_DIR/$OS_DIR/$ARCH_DIR" -maxdepth 2 -name "apt-runtime-deps.txt" 2>/dev/null | head -n1)"
              fi

              if [ -z "$DEPS_FILE" ] \vert{}\vert{} [ ! -f "$DEPS_FILE" ]; then
                  echo "[Error] No runtime dependency list found for $OS_DIR/$ARCH_DIR under$SCRIPT_DIR"
                  exit 1
              fi

              PKGS=$(tr '\\n' ' ' < "$DEPS_FILE" | xargs)
              if [ -z "$PKGS" ]; then
                  echo "[Info] No extra runtime packages required."
                  exit 0
              fi

              echo "[Info] Installing runtime system packages from: $DEPS_FILE"
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends $PKGS
              echo "[Info] Runtime dependencies installed successfully."
          """), encoding="utf-8")
          install_sh.chmod(0o755)
          PYEOF

      - name: 9. Generate root CMakeLists.txt & README.md
        shell: bash
        run: |
          PKG_NAME="${{ steps.meta.outputs.pkg_name }}"
          VER="${{ inputs.qt_version }}"

          python3 - "$PKG_NAME" "$VER" << 'PYEOF'
          import sys, textwrap
          from pathlib import Path

          pkg_name = sys.argv[1]
          ver = sys.argv[2]
          pkg_dir = Path("dist") / pkg_name

          (pkg_dir / "CMakeLists.txt").write_text(textwrap.dedent("""\
              cmake_minimum_required(VERSION 3.21)

              if(WIN32)
                  set(_QT_OS "Win11")
              elseif(APPLE)
                  set(_QT_OS "MacOS")
              elseif(UNIX)
                  if(EXISTS "/etc/os-release")
                      file(READ "/etc/os-release" _OS_RELEASE)
                      string(REGEX MATCH "VERSION_ID=\\"([0-9]+\\\\.[0-9]+)\\"" _MATCH "${_OS_RELEASE}")
                      if(CMAKE_MATCH_1)
                          set(_QT_OS "Ubuntu${CMAKE_MATCH_1}")
                      else()
                          set(_QT_OS "Linux")
                      endif()
                  else()
                      set(_QT_OS "Linux")
                  endif()
              else()
                  message(FATAL_ERROR "[Qt] Unsupported OS: ${CMAKE_SYSTEM_NAME}")
              endif()

              string(TOLOWER "${CMAKE_SYSTEM_PROCESSOR}" _PROC_LOWER)
              if(_PROC_LOWER MATCHES "aarch64|arm64")
                  set(_QT_ARCH "arm64")
              elseif(_PROC_LOWER MATCHES "x86_64|amd64|x64")
                  set(_QT_ARCH "amd64")
              else()
                  message(FATAL_ERROR "[Qt] Unsupported CPU architecture: ${CMAKE_SYSTEM_PROCESSOR}")
              endif()

              if(MSVC)
                  if(MSVC_VERSION GREATER_EQUAL 1950)
                      set(_QT_COMPILER "msvc2026")
                  else()
                      set(_QT_COMPILER "msvc2022")
                  endif()
              elseif(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
                  string(REGEX MATCH "^[0-9]+" _GCC_MAJOR "${CMAKE_CXX_COMPILER_VERSION}")
                  set(_QT_COMPILER "gcc${_GCC_MAJOR}")
              elseif(CMAKE_CXX_COMPILER_ID MATCHES "Clang")
                  set(_QT_COMPILER "clang")
              else()
                  message(FATAL_ERROR "[Qt] Unsupported compiler: ${CMAKE_CXX_COMPILER_ID}")
              endif()

              set(_QT_TARGET_DIR "${CMAKE_CURRENT_SOURCE_DIR}/${_QT_OS}/${_QT_ARCH}/${_QT_COMPILER}")
              if(NOT EXISTS "${_QT_TARGET_DIR}")
                  message(FATAL_ERROR "[Qt] Prebuilt Qt not found for ${_QT_OS}/${_QT_ARCH}/${_QT_COMPILER} at:${_QT_TARGET_DIR}")
              endif()

              message(STATUS "[Qt] Using prebuilt package for: ${_QT_OS}/${_QT_ARCH}/${_QT_COMPILER}")

              set(_NEW_PREFIX_PATH "${_QT_TARGET_DIR};${CMAKE_PREFIX_PATH}")
              set(CMAKE_PREFIX_PATH "${_NEW_PREFIX_PATH}" PARENT_SCOPE)
              set(LIBQT_DIR "${_QT_TARGET_DIR}" PARENT_SCOPE)
          """), encoding="utf-8")

          (pkg_dir / "README.md").write_text(textwrap.dedent(f"""\
              # Prebuilt Qt {ver} (`{pkg_name}`)

              Prebuilt Qt ({ver}) binaries structured for cross-platform CMake projects.

              ## Directory Structure

              ```text
              {pkg_name}/
              ├── CMakeLists.txt       # Auto-detects OS, architecture, and compiler
              ├── README.md            # Integration and setup guide
              ├── install_deps.sh      # Runtime dependency installer (Linux/Ubuntu builds only)
              └── <OS>/<Arch>/<Compiler>/
                  ├── bin/
                  ├── include/
                  ├── lib/
                  └── plugins/
              ```

              Multiple platform archives (e.g., `Win11-amd64-msvc2026`, `Ubuntu22.04-arm64-gcc11`) can be extracted into the same `{pkg_name}/` root directory side by side.

              ## CMake Integration

              1. Extract this archive into your project's third-party directory (e.g., `ThirdParty/{pkg_name}`).
              2. Add the subdirectory before calling `find_package(Qt6 ...)` in your root `CMakeLists.txt`:

              ```cmake
              add_subdirectory(ThirdParty/{pkg_name})
              find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets)
              ```

              The included `CMakeLists.txt` automatically resolves the matching `<OS>/<Arch>/<Compiler>` path, appends it to `CMAKE_PREFIX_PATH`, and exposes `LIBQT_DIR`.

              ## Linux / Ubuntu Target Setup (Including NVIDIA Jetson)

              On clean Ubuntu or Jetson environments, required X11/XCB/OpenGL runtime libraries may not be pre-installed. Run the bundled helper script from the package root before launching your application:

              ```bash
              chmod +x install_deps.sh
              ./install_deps.sh
              ```

              This script detects the current Ubuntu version and architecture, reads `<OS>/<Arch>/<Compiler>/apt-runtime-deps.txt`, and installs only the required runtime packages via `apt-get`.
          """), encoding="utf-8")
          PYEOF

      - name: 10. Package ZIP archive
        shell: bash
        run: |
          cd dist
          cmake -E tar "cfv" "../${{ steps.meta.outputs.zip_name }}" --format=zip "${{ steps.meta.outputs.pkg_name }}"

      - name: 11. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.qt_version }}
          name: Qt ${{ inputs.qt_version }}
          draft: false
          files: ${{ steps.meta.outputs.zip_name }}
